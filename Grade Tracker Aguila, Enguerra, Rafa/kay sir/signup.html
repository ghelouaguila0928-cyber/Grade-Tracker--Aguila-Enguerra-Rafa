<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - GradeTracker Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- sign up Page -->
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-graduation-cap"></i> GradeTracker Pro</h1>
                <h2>Create Your Account</h2>
                <p>Join thousands of students and teachers tracking academic performance</p>
            </div>
            
            <div class="auth-body">
                <div class="social-login">
                    <button class="social-btn google-btn">
                        <i class="fab fa-google"></i> Sign up with Google
                    </button>
                    <button class="social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i> Sign up with Facebook
                    </button>
                </div>
                
                <div class="divider">
                    <span>or sign up with email</span>
                </div>
                
                <form id="signup-form" class="auth-form">
                    <div class="form-group">
                        <label for="signup-name">Full Name</label>
                        <input type="text" id="signup-name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" class="form-control" placeholder="your.email@school.edu" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" class="form-control" placeholder="Create a strong password" required>
                        <div class="password-strength">
                            <div class="strength-bar">
                                <div class="strength-fill weak"></div>
                            </div>
                            <div class="strength-text">Password strength: Weak</div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password</label>
                        <input type="password" id="signup-confirm-password" class="form-control" placeholder="Re-enter your password" required>
                    </div>
                    
                    <div class="form-group">
                        <label>I am a</label>
                        <div class="role-options">
                            <div class="role-option selected" data-role="student">
                                <i class="fas fa-user-graduate"></i>
                                <span>Student</span>
                            </div>
                            <div class="role-option" data-role="teacher">
                                <i class="fas fa-chalkboard-teacher"></i>
                                <span>Teacher</span>
                            </div>
                        </div>
                        <input type="hidden" id="signup-role" value="student" required>
                    </div>
                    
                    <div class="terms-checkbox">
                        <input type="checkbox" id="agree-terms" required>
                        <label for="agree-terms">
                            I agree to the <a href="#" class="terms-link">Terms of Service</a> and 
                            <a href="#" class="terms-link">Privacy Policy</a>.
                        </label>
                    </div>
                    
                    <button type="submit" class="btn btn-secondary submit-btn">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
                
                <div class="auth-switch">
                    Already have an account? <a href="login.html">Log in here</a>
                </div>
                
                <div class="auth-back">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
                </div>
            </div>
        </div>
    </div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
